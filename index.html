<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webcam Preview</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: #2b2b2b;
            color: #f5f1e8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 600;
            text-align: center;
        }

        button {
            appearance: none;
            border: 0;
            border-radius: 8px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1rem;

            background: #f5f1e8;
            color: #2b2b2b;

            font: inherit;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: default;
        }

        video {
            display: block;
            width: 100%;
            max-width: 1200px;
            height: auto;
            max-height: calc(100vh - 8rem);
            object-fit: contain;
        }

        #errorMessage {
            width: 100%;
            max-width: 1200px;
            margin: 0.75rem 0 0;
            color: #ffb4ab;
            text-align: center;
            font-size: 0.9rem;
        }


        @media (max-width: 600px) {
            body {
                padding: 0.75rem;
            }

            video {
                max-height: calc(100vh - 7rem);
                border-radius: 6px;
            }
        }
    </style>

</head>

<body>
    <h1>Webcam Preview</h1>

    <p>Test your webcam, fully offline.</p>

    <button id="cameraButton">Start Camera</button>

    <video id="video" autoplay playsinline></video>

    <p id="errorMessage"></p>

    <script>
        const video = document.getElementById('video');
        const button = document.getElementById('cameraButton');
        const error = document.getElementById('errorMessage');

        button.addEventListener('click', async () => {
            button.disabled = true;
            button.textContent = 'Requesting camera access…';
            error.textContent = '';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    }
                });

                video.srcObject = stream;
                button.textContent = 'Camera Active';

            } catch (err) {
                button.disabled = false;
                button.textContent = 'Try Again';

                error.textContent = `Camera access failed: ${err.message}`;
            }
        });

    </script>

</body>

</html>
